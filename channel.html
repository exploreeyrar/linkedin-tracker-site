<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram 频道 · Job Application Tracker</title>
<meta name="description" content="Telegram 群 / 频道消息实时镜像">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📡</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;      --card: #ffffff;   --fg: #14181d;   --sub: #5d6874;
    --line: #e2e6ea;    --accent: #0a66c2; --shadow: 0 1px 3px rgba(16,24,40,.07), 0 1px 2px rgba(16,24,40,.04);
    --pop: 0 10px 34px rgba(16,24,40,.18);
    --ok: #047857;      --warn: #b45309;   --err: #b91c1c;
    --bubble: #ffffff;  --mine: #dbeafe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;    --card: #1c2229;   --fg: #e8eaed;   --sub: #98a2ae;
      --line: #2b333c;  --accent: #6cb6ff; --shadow: 0 1px 3px rgba(0,0,0,.4);
      --pop: 0 10px 34px rgba(0,0,0,.6);
      --ok: #34d399;    --warn: #fbbf24;   --err: #f87171;
      --bubble: #1c2229; --mine: #1e3a5f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  header {
    flex: 0 0 auto; background: var(--card); border-bottom: 1px solid var(--line);
    padding: 12px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
  /* 多了个优先级下拉之后头部容易挤到换行 —— 让这段说明先让位、超出就省略号 */
  header .who {
    color: var(--sub); font-size: 12px; white-space: nowrap;
    flex: 0 1 auto; min-width: 0; max-width: 30ch;
    overflow: hidden; text-overflow: ellipsis;
  }
  header .sp { margin-left: auto; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--bg); white-space: nowrap;
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--sub); flex: 0 0 8px; }
  .pill.live  { color: var(--ok);   border-color: currentColor; }
  .pill.live i  { background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }
  .pill.poll  { color: var(--warn); border-color: currentColor; }
  .pill.poll i  { background: currentColor; }
  .pill.down  { color: var(--err);  border-color: currentColor; }
  .pill.down i  { background: currentColor; }

  .navbtn {
    font: inherit; font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap;
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
  }
  .navbtn:hover { border-color: var(--accent); color: var(--accent); }

  #q, #prio {
    font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  #q { min-width: 190px; }
  #q:focus, #prio:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #prio.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  main { flex: 1 1 auto; overflow: auto; padding: 18px; overscroll-behavior: contain; }
  .feed { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  .daysep { display: flex; align-items: center; gap: 10px; color: var(--sub); font-size: 11.5px; margin: 10px 0 2px; }
  .daysep::before, .daysep::after { content: ''; flex: 1 1 auto; height: 1px; background: var(--line); }

  .msg {
    background: var(--bubble); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px 11px; box-shadow: var(--shadow); max-width: 100%;
  }
  .msg.bot { background: color-mix(in srgb, var(--accent) 7%, var(--bubble)); }
  .msg.fresh { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .msg .hd { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; font-size: 12px; }
  .msg .au { font-weight: 700; color: var(--accent); }
  .msg .tm { color: var(--sub); font-variant-numeric: tabular-nums; margin-left: auto; }
  .msg .ed { color: var(--sub); font-size: 11px; }
  .msg .kind {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); margin-bottom: 4px;
  }
  .msg .re {
    border-left: 3px solid var(--accent); padding: 2px 0 2px 9px; margin-bottom: 6px;
    color: var(--sub); font-size: 12px; line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .msg .tx { font-size: 14.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg .tx a { color: var(--accent); }
  .msg mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; }

  /* 群里的图片：Worker 代拿，Bot Token 不下发到浏览器 */
  .msg .pic {
    display: block; max-width: 100%; max-height: 380px; width: auto; border-radius: 9px;
    margin: 2px 0 8px; border: 1px solid var(--line); cursor: zoom-in; background: var(--bg);
  }
  .msg .pic.broken { display: none; }
  .msg .picerr { font-size: 12px; color: var(--sub); margin-bottom: 6px; }

  .msg .arch {
    float: right; margin-left: 8px; border: 1px solid transparent; background: transparent;
    font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
    line-height: 1.5; padding: 2px 9px; border-radius: 999px; color: var(--sub);
  }
  .msg .arch:hover { border-color: var(--accent); color: var(--accent); }
  .msg.archived { opacity: .72; }
  .msg .archat { font-size: 11px; color: var(--sub); }

  /* 从直达链接点进来时高亮的那一条（配色和 index.html 的定位高亮一致） */
  .msg.hl { background: #fff5c2; border-color: #eab308; }
  .msg.hl .tx, .msg.hl .au { color: #3d3200; }
  @media (prefers-color-scheme: dark) {
    .msg.hl { background: #4a4218; border-color: #eab308; }
    .msg.hl .tx { color: #f5efd0; }
    .msg.hl .au { color: #ffd970; }
  }
  .msg .lnk {
    float: right; margin-left: 6px; border: 1px solid transparent; background: transparent;
    cursor: pointer; font-size: 13px; line-height: 1.5; padding: 2px 6px; border-radius: 6px; color: var(--sub);
  }
  .msg .lnk:hover { background: var(--line); color: var(--fg); }

  /* 头部那排：Archived (N 件) */
  .navbtn[hidden] { display: none; }
  .navbtn.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .navbtn b { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 两条横幅一起悬浮在顶部。放进一个固定容器里纵向排，
     免得「定位到某条」和「正在看 archive」同时出现时叠在一起。 */
  .topbars {
    position: fixed; left: 50%; transform: translateX(-50%); top: 74px; z-index: 30;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    max-width: min(720px, calc(100vw - 32px)); pointer-events: none;
  }
  .topbars .archbar {
    margin: 0; width: auto; box-shadow: var(--pop); pointer-events: auto;
  }
  #hlbar { border-color: #eab308; }
  #hlbar button { border-color: #eab308; }

  /* 正在看 archive 列表时顶部的横幅 */
  .archbar {
    max-width: 900px; margin: 0 auto 14px; display: flex; align-items: center; gap: 12px;
    font-size: 13px; background: var(--card); border: 1px solid var(--accent);
    border-radius: 10px; padding: 10px 16px;
  }
  .archbar[hidden] { display: none; }
  .archbar button {
    font: inherit; font-size: 12px; font-weight: 600; margin-left: auto;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .archbar button:hover { border-color: var(--accent); color: var(--accent); }

  /* 点开看大图 */
  .lightbox {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.88);
    display: flex; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  .gapnote {
    max-width: 900px; margin: 0 auto 14px; font-size: 12.5px; line-height: 1.7;
    color: var(--sub); background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--accent); border-radius: 10px; padding: 11px 16px;
  }
  .gapnote[hidden] { display: none; }
  .gapnote b { color: var(--fg); }
  .gapnote button {
    font: inherit; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--sub); margin-left: 8px;
  }
  .gapnote button:hover { border-color: var(--err); color: var(--err); }

  .note {
    max-width: 900px; margin: 0 auto 16px; background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--warn); border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow);
  }
  .note[hidden] { display: none; }
  .note h2 { font-size: 14px; margin: 0 0 8px; }
  .note ol { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.85; }
  .note code {
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 6px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    word-break: break-all;
  }
  .note .sm { color: var(--sub); font-size: 12px; margin-top: 8px; line-height: 1.6; }

  .empty { text-align: center; color: var(--sub); padding: 48px 16px; font-size: 14px; }

  .jump {
    position: fixed; right: 22px; bottom: 22px; z-index: 20;
    font: inherit; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 999px;
    border: 0; background: var(--accent); color: #fff; cursor: pointer; box-shadow: var(--pop);
  }
  .jump[hidden] { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: rgba(20,20,20,.93); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; z-index: 30; opacity: 0; transition: opacity .18s ease; pointer-events: none;
    max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>📡 Telegram 频道</h1>
  <span class="who" id="who"></span>
  <span class="pill down sp" id="state"><i></i><span id="stateText">连接中…</span></span>
  <input id="q" type="search" placeholder="搜索消息…（含已 archive）" autocomplete="off">
  <select id="prio" title="按消息里写的优先级筛选（含已 archive）">
    <option value="">全部优先级</option>
    <option value="紧急">紧急</option>
    <option value="高">高</option>
    <option value="中">中</option>
    <option value="低">低</option>
  </select>
  <a class="navbtn" id="back" href="./index.html">📮 回到投递清单</a>
  <button class="navbtn" id="archFab" type="button" hidden>Archived (<b id="archN">0</b> 件)</button>
</header>

<main id="scroll">
  <div class="note" id="setup" hidden>
    <h2 id="setupTitle">还没有收到任何消息 —— 需要先接上 Telegram</h2>
    <ol id="setupSteps"></ol>
    <div class="sm">
      Bot API 拿不到它加入之前的历史消息，只能从接上 webhook 那一刻起往后同步。
    </div>
  </div>
  <div class="gapnote" id="gapnote" hidden></div>

  <div class="feed" id="feed"></div>
  <div class="empty" id="empty" hidden>还没有消息。往那个群 / 频道里发一条试试。</div>
</main>

<!-- 两条横幅都悬浮在顶部；同时出现时纵向排开，不会互相盖住 -->
<div class="topbars">
  <div class="archbar" id="hlbar" hidden>
    <span id="hlText">已定位到这条消息</span>
    <button type="button" id="hlClear">取消高亮</button>
  </div>
  <div class="archbar" id="archbar" hidden>
    <span id="archbarText">正在看已 archive 的消息</span>
    <button type="button" id="archBack">← 回到通知流</button>
  </div>
</div>

<button class="jump" id="jump" type="button" hidden>↓ 有新消息</button>
<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"></div>

<script id="cfg" type="application/json">__CONFIG__</script>
<script>
(function () {
  'use strict';

  var CONFIG = JSON.parse(document.getElementById('cfg').textContent) || {};
  var ENDPOINT = CONFIG.tgEndpoint || '';
  var APPKEY = CONFIG.tgAppKey || '';

  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  var toastTimer = null;
  function toast(m) {
    var t = $('toast');
    t.textContent = m;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- 状态 ---------- */
  var MSGS = [];              // uid → 消息，展开成数组，按 ts 升序
  var BY_UID = {};
  var newest = 0;             // 已经收到的最新时间戳（编辑也算），拉增量时传给 Worker
  var live = false;           // 是否走 Durable Object（能开 WebSocket）
  var hooked = false;         // Worker 上配了 WEBHOOK_SECRET 没有
  var ws = null;
  var wsTries = 0;
  var pollTimer = null;

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtTime(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function fmtDay(ms) {
    var d = new Date(ms), t = new Date();
    var same = d.toDateString() === t.toDateString();
    var y = new Date(t.getTime() - 86400000);
    if (same) return '今天';
    if (d.toDateString() === y.toDateString()) return '昨天';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function fmtFull(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
         + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function setState(kind, text) {
    var p = $('state');
    p.className = 'pill sp ' + kind;
    $('stateText').textContent = text;
  }

  /* ---------- 渲染 ---------- */
  // 正文里的链接做成可点的；其余一律走 textContent，不碰 innerHTML
  var URL_RE = /(https?:\/\/[^\s<>"']+)/g;
  function textNodes(into, text, needle) {
    String(text).split(URL_RE).forEach(function (part, i) {
      if (!part) return;
      if (i % 2 === 1) {
        var a = el('a', null, part);
        a.href = part; a.target = '_blank'; a.rel = 'noopener noreferrer';
        into.appendChild(a);
      } else {
        appendHighlighted(into, part, needle);
      }
    });
  }
  // 搜索命中的部分套 <mark>，同样只用 DOM 拼
  function appendHighlighted(into, text, needle) {
    if (!needle) { into.appendChild(document.createTextNode(text)); return; }
    var low = text.toLowerCase(), n = needle.toLowerCase(), from = 0, at;
    while ((at = low.indexOf(n, from)) !== -1) {
      if (at > from) into.appendChild(document.createTextNode(text.slice(from, at)));
      into.appendChild(el('mark', null, text.slice(at, at + n.length)));
      from = at + n.length;
    }
    into.appendChild(document.createTextNode(text.slice(from)));
  }

  /* ---------- 每条消息的直达链接 ----------
   * 和 index.html 的 #job-<id> / 通知板的 #msg-<id> 一个路子：
   * 点开链接就滚到那一条并高亮。uid 形如「-1003974378230:28」，带冒号，
   * 所以放进 hash 前先编码。 */
  function msgLinkFor(m) {
    return location.origin + location.pathname + '#m-' + encodeURIComponent(m.uid);
  }
  function targetUid() {
    var h = location.hash || '';
    if (h.slice(0, 3) !== '#m-') return '';
    try { return decodeURIComponent(h.slice(3)); } catch (e) { return h.slice(3); }
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; },
                                                      function () { return copyFallback(text); });
    }
    return Promise.resolve(copyFallback(text));
  }
  // http:// 或旧浏览器上没有 clipboard API，退回 execCommand
  function copyFallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  /** 图片走 Worker 代理：URL 里只有 file_id，Bot Token 留在服务端 */
  function fileUrl(fileId) {
    return ENDPOINT.replace(/\/+$/, '') + '/tg/file?id=' + encodeURIComponent(fileId);
  }

  function msgNode(m, needle, fresh) {
    var box = el('div', 'msg' + (m.bot ? ' bot' : '') + (fresh ? ' fresh' : '') + (m.archivedAt ? ' archived' : ''));
    box.id = 'm-' + m.uid;

    var hd = el('div', 'hd');
    hd.appendChild(el('span', 'au', m.author || (m.bot ? 'Bot' : '匿名')));
    if (m.editedTs) hd.appendChild(el('span', 'ed', '（已编辑）'));
    var tm = el('span', 'tm', fmtTime(m.ts));
    tm.title = fmtFull(m.ts);
    hd.appendChild(tm);

    var cp = el('button', 'lnk', '⧉');
    cp.type = 'button';
    cp.title = '复制这条消息的正文';
    cp.addEventListener('click', function () {
      // 纯媒体消息没有正文，那就把类型标记（🖼 图片…）复制出去，别复制个空
      var body = m.text || m.kind || '';
      if (!body) { toast('这条没有可复制的文字'); return; }
      copyText(body).then(function (ok) {
        toast(ok ? ('已复制 ' + body.replace(/\s+/g, ' ').trim().slice(0, 20) + '…') : '复制失败');
      });
    });
    hd.appendChild(cp);

    var lnk = el('button', 'lnk', '🔗');
    lnk.type = 'button';
    lnk.title = '复制这条消息的直达链接';
    lnk.addEventListener('click', function () {
      var url = msgLinkFor(m);
      copyText(url).then(function (ok) { toast(ok ? ('已复制链接：' + url) : '复制失败'); });
    });
    hd.appendChild(lnk);

    var arch = el('button', 'arch', m.archivedAt ? '↩ 取回' : '🗂 archive');
    arch.type = 'button';
    arch.title = m.archivedAt
      ? '放回通知流（不会动 Telegram 里的原消息）'
      : '收进 archive（不会动 Telegram 里的原消息）';
    arch.addEventListener('click', function () { setArchived(m, !m.archivedAt); });
    hd.appendChild(arch);
    if (m.archivedAt) hd.appendChild(el('span', 'archat', '🗂 ' + fmtFull(m.archivedAt)));
    box.appendChild(hd);

    if (m.replyText) box.appendChild(el('div', 're', '↩ ' + m.replyText));
    if (m.kind) box.appendChild(el('div', 'kind', m.kind));

    if (m.media && m.media.fileId) {
      var img = document.createElement('img');
      img.className = 'pic';
      img.loading = 'lazy';
      img.alt = m.kind || '图片';
      if (m.media.w && m.media.h) {
        img.width = m.media.w; img.height = m.media.h;   // 先占好位，图到了不跳版
      }
      img.src = fileUrl(m.media.fileId);
      img.addEventListener('click', function () {
        $('lightboxImg').src = img.src;
        $('lightbox').hidden = false;
      });
      // 超过 20MB 的文件 Telegram 的 getFile 拿不到，别留一个破图标
      img.addEventListener('error', function () {
        img.classList.add('broken');
        box.insertBefore(el('div', 'picerr', '（这张图 Telegram 取不到，可能超过 20MB）'), img);
      });
      box.appendChild(img);
    }

    if (m.text) {
      var tx = el('div', 'tx');
      textNodes(tx, m.text, needle);
      box.appendChild(tx);
    }
    return box;
  }

  $('lightbox').addEventListener('click', function () { this.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('lightbox').hidden = true; });

  /* archive 的状态存在服务端（见 Worker 的 inbox_archive），不是各人的浏览器里 ——
     谁 archive 的，所有连着的页面立刻同步，别人打开看到的也一样。 */
  var showArchived = false;
  var hlUid = '';           // 当前被直达链接高亮的那条

  /* ---------- 优先级 ----------
   * 从消息正文里读，不是我们自己打的标。看板发出去的模板写「📍优先级：低（下班后处理 OK）」，
   * 手写的那些用的是「优先度：高」—— 两种写法都认，否则手写的那批全筛不出来。
   * 只取第一处：一条消息里出现多次时，最前面那个才是它自己的优先级
   * （后面的多半来自被引用 / 转发的内容）。 */
  var PRIO_RE = /优先[级度]\s*[：:]?\s*([紧高中低])/;
  function prioOf(m) {
    const t = String((m && m.text) || '');
    const hit = t.match(PRIO_RE);
    if (!hit) return '';
    return hit[1] === '紧' ? '紧急' : hit[1];
  }

  function render(freshUids) {
    // 最后一条被取回之后，别把人晾在一个空的 archive 视图里（那时按钮已经消失了）
    if (showArchived && !MSGS.some(function (m) { return m.archivedAt; })) showArchived = false;

    var needle = $('q').value.trim();
    var low = needle.toLowerCase();
    var prio = $('prio').value;
    // 搜索 / 筛选一律跨越 archive 分区 —— 找东西的时候不该因为「收起来了」就找不到
    var filtering = !!needle || !!prio;

    var list = filtering
      ? MSGS.slice()
      : MSGS.filter(function (m) { return !!m.archivedAt === showArchived; });
    if (prio) list = list.filter(function (m) { return prioOf(m) === prio; });
    if (needle) {
      list = list.filter(function (m) {
        return (m.text + ' ' + m.author + ' ' + m.kind).toLowerCase().indexOf(low) !== -1;
      });
    }
    renderPrioCounts(prio);

    var feed = $('feed');
    feed.textContent = '';
    var lastDay = '';
    list.forEach(function (m) {
      var day = fmtDay(m.ts);
      if (day !== lastDay) { feed.appendChild(el('div', 'daysep', day)); lastDay = day; }
      feed.appendChild(msgNode(m, needle, freshUids && freshUids[m.uid]));
    });

    // feed 每次都是整块重建，重绘后要把定位高亮补回去
    if (hlUid) {
      var hlNode = document.getElementById('m-' + hlUid);
      if (hlNode) hlNode.classList.add('hl');
    }

    var live = MSGS.filter(function (m) { return !m.archivedAt; });
    var arch = MSGS.length - live.length;

    $('empty').hidden = list.length > 0 || (!MSGS.length && !hooked);
    if (filtering && !list.length) {
      $('empty').hidden = false;
      $('empty').textContent = '没有符合条件的消息'
        + (needle ? ('（搜索「' + needle + '」）') : '')
        + (prio ? ('（优先级 ' + prio + '）') : '') + '。';
    } else if (showArchived && !list.length) {
      $('empty').hidden = false; $('empty').textContent = '还没有 archive 过任何消息。';
    } else if (!filtering) {
      $('empty').textContent = '还没有消息。往那个群 / 频道里发一条试试。';
    }

    $('archFab').hidden = !arch;
    $('archFab').classList.toggle('on', showArchived && !filtering);
    $('archN').textContent = String(arch);
    $('prio').classList.toggle('on', !!prio);
    // 筛选时结果是跨 archive 的，这时候再说「正在看已 archive」就不对了
    $('archbar').hidden = !showArchived || filtering;
    $('archbarText').textContent = '正在看已 archive 的消息（' + arch + ' 条）';
    if (filtering) {
      var nArch = list.filter(function (m) { return m.archivedAt; }).length;
      $('archbar').hidden = !nArch;
      $('archbarText').textContent = '搜索结果里有 ' + nArch + ' 条是已 archive 的（淡显那几条）';
    }

    renderGaps();
    var newest = live.length ? live[live.length - 1] : (MSGS.length ? MSGS[MSGS.length - 1] : null);
    $('who').textContent = newest
      ? ((newest.chatTitle || '') + '　共 ' + live.length + ' 条'
         + (arch ? ('（另有 ' + arch + ' 条已 archive）') : '')
         + '　最后一条 ' + fmtFull(newest.ts))
      : '';
    updateSetup();
  }

  /** 把每个优先级的条数写进下拉选项，形如「高 (3)」 */
  function renderPrioCounts(current) {
    var sel = $('prio');
    var n = {};
    MSGS.forEach(function (m) {
      var p = prioOf(m);
      if (p) n[p] = (n[p] || 0) + 1;
    });
    [].forEach.call(sel.options, function (o) {
      if (!o.value) { o.textContent = '全部优先级 (' + MSGS.length + ')'; return; }
      o.textContent = o.value + ' (' + (n[o.value] || 0) + ')';
    });
    sel.value = current || '';
  }

  $('prio').addEventListener('change', function () { render(); scrollToBottom(); });

  /**
   * 定位到某一条：先把可能挡住它的筛选条件清掉，
   * 归档的那条自动切到 archive 视图，然后滚过去并高亮。
   */
  function focusMsg(uid, scroll) {
    if (!uid) return;
    var m = BY_UID[uid];
    if (!m) {
      hlUid = '';
      // 找不到就得把上一次的高亮撤掉，否则会以为定位到的是那一条
      [].forEach.call(document.querySelectorAll('.msg.hl'), function (n) { n.classList.remove('hl'); });
      $('hlbar').hidden = false;
      $('hlText').textContent = '链接指向的消息不在收件箱里（可能已被删除）';
      return;
    }
    hlUid = uid;
    $('q').value = '';
    $('prio').value = '';
    showArchived = !!m.archivedAt;
    render();
    $('hlbar').hidden = false;
    $('hlText').textContent = '已定位到 ' + (m.author || '这条消息') + ' 于 ' + fmtFull(m.ts) + ' 的消息'
      + (m.archivedAt ? '（已 archive）' : '');
    if (scroll) {
      var node = document.getElementById('m-' + uid);
      if (node) node.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  function clearHighlight() {
    hlUid = '';
    [].forEach.call(document.querySelectorAll('.msg.hl'), function (n) { n.classList.remove('hl'); });
    $('hlbar').hidden = true;
    // 清掉 hash，免得刷新之后又亮起来
    history.replaceState(null, '', location.pathname + location.search);
  }
  $('hlClear').addEventListener('click', clearHighlight);
  window.addEventListener('hashchange', function () { focusMsg(targetUid(), true); });

  $('archFab').addEventListener('click', function () {
    showArchived = !showArchived;
    render();
    scrollToBottom();
  });
  $('archBack').addEventListener('click', function () {
    showArchived = false;
    render();
    scrollToBottom();
  });

  /** 滚在底部时才自动跟随；否则显示「↓ 有新消息」 */
  function atBottom() {
    var s = $('scroll');
    return s.scrollHeight - s.scrollTop - s.clientHeight < 80;
  }
  function scrollToBottom() {
    var s = $('scroll');
    s.scrollTop = s.scrollHeight;
    $('jump').hidden = true;
  }
  $('jump').addEventListener('click', scrollToBottom);
  $('scroll').addEventListener('scroll', function () { if (atBottom()) $('jump').hidden = true; });

  /** 收到一批消息（初次加载或增量），合并进来 */
  function ingest(items, animate) {
    if (!items || !items.length) return 0;
    var stick = atBottom();
    var fresh = {}, added = 0;
    items.forEach(function (m) {
      if (!m || !m.uid) return;
      var old = BY_UID[m.uid];
      if (old) {
        // 编辑过的消息：原地更新
        if ((m.editedTs || 0) > (old.editedTs || 0) || m.text !== old.text) {
          MSGS[MSGS.indexOf(old)] = m;
          BY_UID[m.uid] = m;
          fresh[m.uid] = 1;
          added++;
        }
      } else {
        BY_UID[m.uid] = m;
        MSGS.push(m);
        fresh[m.uid] = 1;
        added++;
      }
      newest = Math.max(newest, m.editedTs || 0, m.ts || 0);
    });
    // 投递清单那一页靠这个值算「还有几条没看过」
    try { localStorage.setItem('sgjob_channel_seen', String(newest)); } catch (e) {}
    if (!added) return 0;
    MSGS.sort(function (a, b) { return a.ts - b.ts; });
    render(animate ? fresh : null);
    if (stick) scrollToBottom(); else $('jump').hidden = false;
    return added;
  }

  /** 把若干条从本地视图里抹掉（服务端已经删了，或正要删） */
  function forget(uids) {
    var gone = 0;
    uids.forEach(function (uid) {
      var m = BY_UID[uid];
      if (!m) return;
      MSGS.splice(MSGS.indexOf(m), 1);
      delete BY_UID[uid];
      gone++;
    });
    if (gone) render();
    return gone;
  }

  /** archive / 取回。不弹确认框 —— 消息还在，随时能从右下角取回来。 */
  function setArchived(m, on) {
    var prev = m.archivedAt || 0;
    m.archivedAt = on ? Date.now() : 0;   // 先动界面，别让人等网络
    render();
    call({ action: 'inbox_archive', uids: JSON.stringify([m.uid]), on: on ? '1' : '0' })
      .then(function () { toast(on ? '已 archive' : '已取回'); })
      .catch(function (e) {
        m.archivedAt = prev;              // 服务端没认，界面退回去
        render();
        toast((on ? 'archive' : '取回') + '失败：' + (e.message || e));
      });
  }

  /* ---------- 缺号提示 ----------
   * msgId 在一个会话里是连续的，缺号就说明那几条没收到 —— 基本都是
   * webhook 接上之前发的（Bot API 不回溯历史）。
   * 补救办法只有一个：去 Telegram 里编辑一下那条老消息，
   * 编辑事件会把它连同原始时间戳一起送过来。 */
  function renderGaps() {
    var box = $('gapnote');
    // 默认不显示。想看的话把 localStorage 的 sgjob_channel_gapoff 设成 '0'。
    var off = true;
    try { off = localStorage.getItem('sgjob_channel_gapoff') !== '0'; } catch (e) {}
    // msgId 在一个会话里连续递增，缺号就是没收到的
    var ids = MSGS.map(function (m) { return Number(m.msgId); })
                  .filter(function (n) { return n > 0; })
                  .sort(function (a, b) { return a - b; });
    var gaps = [];
    for (var i = 1; i < ids.length; i++) {
      if (ids[i] - ids[i - 1] > 1) gaps.push([ids[i - 1] + 1, ids[i] - 1]);
    }
    gaps = gaps.slice(0, 40);
    if (off || !gaps.length) { box.hidden = true; return; }
    var total = MSGS.length;
    var n = gaps.reduce(function (a, g) { return a + (g[1] - g[0] + 1); }, 0);
    box.textContent = '';
    box.appendChild(document.createTextNode('已收到 '));
    box.appendChild(el('b', null, String(total)));
    box.appendChild(document.createTextNode(' 条，另有 '));
    box.appendChild(el('b', null, String(n)));
    box.appendChild(document.createTextNode(' 条没收到（消息序号 '
      + gaps.map(function (g) { return g[0] === g[1] ? ('#' + g[0]) : ('#' + g[0] + '–' + g[1]); }).join('、')
      + '）。多半是 webhook 接上之前发的 —— 在 Telegram 里编辑一下那条消息（哪怕只加个空格），它就会连原始时间一起补进来。'));
    var hide = el('button', null, '不再提示');
    hide.type = 'button';
    hide.addEventListener('click', function () {
      try { localStorage.setItem('sgjob_channel_gapoff', '1'); } catch (e) {}
      box.hidden = true;
    });
    box.appendChild(hide);
    box.hidden = false;
  }

  /* ---------- 拉取 ---------- */
  function call(payload) {
    if (!ENDPOINT) return Promise.reject(new Error('还没有配置 Telegram 中继（config.json 的 tgEndpoint）'));
    var opts = { method: 'POST', body: new URLSearchParams(payload), cache: 'no-store' };
    if (APPKEY) opts.headers = { 'X-App-Key': APPKEY };
    return fetch(ENDPOINT, opts)
      .then(function (res) { return res.json().catch(function () { return { ok: false, description: 'HTTP ' + res.status }; }); })
      .then(function (d) { if (!d.ok) throw new Error(d.description || 'unknown error'); return d; });
  }

  var failures = 0;
  /**
   * full=true 时 since 传 0，拿到的是**完整**列表，于是可以顺便对账：
   * 服务端已经没有的，本地也抹掉 —— 这样在 Telegram 里删掉的消息
   * （通过 /del）以及漏收的删除广播，都能在下一次对账时归位。
   * full=false 只拿增量，轮询时基本是空响应。
   */
  function pull(full) {
    return call({ action: 'inbox', since: String(full ? 0 : newest) }).then(function (d) {
      failures = 0;
      live = !!d.live;
      hooked = !!d.hooked;

      if (full) {
        var alive = {};
        (d.items || []).forEach(function (m) { if (m && m.uid) alive[m.uid] = 1; });
        var stale = MSGS.filter(function (m) { return !alive[m.uid]; }).map(function (m) { return m.uid; });
        if (stale.length) forget(stale);
      }

      ingest(d.items, !full);
      if (live && !ws) connectWS();
      if (!live) setState('poll', '轮询中（未启用实时）');
      return d;
    }).catch(function (e) {
      failures++;
      if (failures >= 2) setState('down', '连不上：' + (e.message || e));
      updateSetup();
    });
  }

  /* ---------- WebSocket：有 Durable Object 时走这条，消息毫秒级到 ---------- */
  function wsUrl() {
    var u = new URL(ENDPOINT);
    u.protocol = (u.protocol === 'http:') ? 'ws:' : 'wss:';
    u.pathname = (u.pathname.replace(/\/+$/, '')) + '/channel/ws';
    return u.toString();
  }

  var beat = null;
  function connectWS() {
    if (ws || !live) return;
    try { ws = new WebSocket(wsUrl()); } catch (e) { ws = null; startPolling(); return; }

    ws.onopen = function () {
      wsTries = 0;
      setState('live', '实时连接中');
      // 完整对账一次：断线期间的新增、删除都在这一下补齐
      pull(true);
      clearInterval(beat);
      beat = setInterval(function () { try { ws.send('ping'); } catch (e) {} }, 45000);
      stopPolling();      // 有推送就不用轮询了
    };
    ws.onmessage = function (ev) {
      if (ev.data === 'pong') return;
      var d = null;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d && d.type === 'msg') {
        if (ingest(d.items, true)) toast('收到新消息');
      } else if (d && d.type === 'del') {
        if (forget(d.uids || [])) toast('有消息被删除');
      } else if (d && d.type === 'arch') {
        // 别处（另一台设备 / 另一个人）archive 的，这边同步过来
        var hit = 0;
        (d.uids || []).forEach(function (uid) {
          var m = BY_UID[uid];
          if (!m) return;
          m.archivedAt = d.on ? (d.at || Date.now()) : 0;
          hit++;
        });
        if (hit) render();
      }
    };
    ws.onclose = function () {
      ws = null;
      clearInterval(beat);
      setState('poll', '重连中…（暂时轮询）');
      startPolling();
      // 指数退避，最长 30 秒
      var wait = Math.min(30000, 1000 * Math.pow(2, Math.min(wsTries++, 5)));
      setTimeout(connectWS, wait);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  /* ---------- 轮询：没有 WebSocket 时的后备 ----------
   * 有焦点时 2 秒一次（这是静态页 + Worker 能做到的最快了），
   * 只是切到后台就没必要烧请求，所以按可见性分档。*/
  function pollDelay() {
    if (document.hidden) return 0;                 // 0 = 停
    return document.hasFocus() ? 2000 : 8000;
  }
  function startPolling() {
    stopPolling();
    var tick = function () {
      var d = pollDelay();
      if (!d) { pollTimer = setTimeout(tick, 1000); return; }   // 后台时只是空转等回来
      pull(false).then(function () { pollTimer = setTimeout(tick, pollDelay() || 1000); });
    };
    pollTimer = setTimeout(tick, 300);
  }
  function stopPolling() { clearTimeout(pollTimer); pollTimer = null; }

  // 切回来时立刻对一次账，别等下一个 tick
  // 回到这一页是最容易看出「和 Telegram 对不上」的时刻，所以这里做完整对账
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(true); });
  window.addEventListener('focus', function () { pull(true); });
  window.addEventListener('online', function () { pull(true); if (live) connectWS(); });

  /* ---------- 还没接通时的引导 ---------- */
  function updateSetup() {
    var need = !ENDPOINT || !hooked || (!MSGS.length);
    var box = $('setup');
    box.hidden = !need;
    if (!need) return;

    $('setupTitle').textContent = !ENDPOINT
      ? '还没有配置 Telegram 中继'
      : (!hooked ? 'Worker 上还没设 WEBHOOK_SECRET' : '还没有收到任何消息 —— 需要先接上 Telegram');

    var host = ENDPOINT ? ENDPOINT.replace(/\/+$/, '') : 'https://<你的-worker>.workers.dev';
    var steps = [
      ['把 bot 拉进那个群 / 频道。频道必须把它设成管理员；群里则要在 BotFather 里 ',
       '/setprivacy → Disable', '，否则 bot 只看得见 @它 的消息。'],
      ['部署带 Durable Object 的新版 Worker：', 'npx wrangler deploy', ''],
      ['设一个 webhook 密钥：', 'npx wrangler secret put WEBHOOK_SECRET', ''],
      ['把 webhook 指过来（<SECRET> 换成上一步那个值）：',
       'curl -X POST "https://api.telegram.org/bot<TG_TOKEN>/setWebhook" -d "url=' + host + '/tg/webhook" -d "secret_token=<SECRET>" -d \'allowed_updates=["message","channel_post","edited_message","edited_channel_post"]\'', ''],
      ['往群 / 频道里发一条消息，这一页几秒内就会出现它。', '', '']
    ];
    var ol = $('setupSteps');
    ol.textContent = '';
    steps.forEach(function (s) {
      var li = document.createElement('li');
      li.appendChild(document.createTextNode(s[0]));
      if (s[1]) li.appendChild(el('code', null, s[1]));
      if (s[2]) li.appendChild(document.createTextNode(s[2]));
      ol.appendChild(li);
    });
  }

  /* ---------- 启动 ---------- */
  $('q').addEventListener('input', function () { render(); });

  if (!ENDPOINT) {
    setState('down', '未配置中继');
    updateSetup();
  } else {
    setState('poll', '连接中…');
    pull(true).then(function () {
      render();
      // 带着 #m-<uid> 进来就是冲某一条来的，别把它滚走
      if (targetUid()) focusMsg(targetUid(), true);
      else scrollToBottom();
      if (!live) startPolling();      // 没有 DO 就一直轮询
    });
    // 兜底：即使 WebSocket 说自己活着，也每分钟完整对一次账，
    // 漏推的新消息和漏掉的删除广播都在这里归位
    setInterval(function () { if (!document.hidden) pull(true); }, 60000);
  }
})();
</script>
</body>
</html>
