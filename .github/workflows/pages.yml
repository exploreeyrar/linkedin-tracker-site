name: Build & Deploy Pages

on:
  # 油猴脚本通过 GitHub API 提交 data/records.json 时触发（用 PAT 提交会触发 workflow）
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'template.html'
      - 'build.py'
      - '.github/workflows/pages.yml'
  # 定期重建：每天 06:17 (Asia/Singapore, UTC+8) —— cron 用的是 UTC
  schedule:
    - cron: '17 22 * * *'
  # 手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署。
#
# 这里刻意不开 cancel-in-progress：油猴脚本每同步一次就是一个 push，
# 而 Pages 的 deploy 步骤动辄要几分钟。一旦开了「取消进行中的」，
# 只要同步得比部署快，每次新推送都会把正在跑的部署掐掉重来 ——
# 结果就是你一直在同步，页面却一直不更新（实测连续 13 次被取消）。
#
# 设成 false 之后：进行中的部署跑完，期间来的新推送排队，
# 且只保留最新的那个（GitHub 会把更早的排队项丢掉），不会堆积。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成 dist/index.html
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
